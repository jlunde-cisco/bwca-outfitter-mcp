[project]
name = "bwca-outfitter-mcp"
version = "0.1.0"
description = "Boundary Waters Outfitter MCP server -- demo server for AI/MCP threat detection"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.6.0,<2",
    "mangum>=0.17.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn>=0.30.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
